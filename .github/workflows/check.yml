# Runs the site checks on every pull request and on every push to main.
name: Check site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data, links and assets
        run: node scripts/check.mjs
      - name: Page behaviour
        run: node scripts/check-interactions.mjs
